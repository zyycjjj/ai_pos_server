name: Deploy Server

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Nest API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/ai-pos-server' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'ai-pos-server' }}
      PORT: ${{ vars.PORT || '4100' }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT || vars.SSH_PORT || '22' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ZenStack artifacts
        run: pnpm zen:generate:server

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Validate deployment configuration
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${DEPLOY_HOST:-}" ] && missing+=("DEPLOY_HOST")
          [ -z "${DEPLOY_USER:-}" ] && missing+=("DEPLOY_USER")
          [ -z "${DEPLOY_SSH_KEY:-}" ] && missing+=("DEPLOY_SSH_KEY")
          [ -z "${DATABASE_URL:-}" ] && missing+=("DATABASE_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub Secrets: ${missing[*]}"
            exit 1
          fi

          echo "DEPLOY_HOST set"
          echo "DEPLOY_USER set"
          echo "SSH_PORT=${SSH_PORT}"
          echo "DEPLOY_PATH=${DEPLOY_PATH}"
          echo "SERVICE_NAME=${SERVICE_NAME}"
          echo "PORT=${PORT}"

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure known hosts
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -f ~/.ssh/known_hosts
          ls -l ~/.ssh/known_hosts
          ssh-add -l

      - name: SSH preflight
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -p "${SSH_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo SSH_AUTH_OK"

      - name: Prepare remote directory
        run: |
          ssh -o BatchMode=yes -p "${SSH_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             mkdir -p '${DEPLOY_PATH}' 2>/dev/null || true
             if [ ! -d '${DEPLOY_PATH}' ]; then
               sudo -n mkdir -p '${DEPLOY_PATH}'
             fi
             if [ ! -w '${DEPLOY_PATH}' ]; then
               sudo -n chown -R '${DEPLOY_USER}':'${DEPLOY_USER}' '${DEPLOY_PATH}'
             fi
             test -d '${DEPLOY_PATH}'
             test -w '${DEPLOY_PATH}'
             echo DEPLOY_PATH_READY"

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            -e "ssh -o BatchMode=yes -p ${SSH_PORT}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Install, migrate, and restart
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -o BatchMode=yes -p "${SSH_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             cd '${DEPLOY_PATH}'
             printf '%s\n' 'NODE_ENV=production' > .env
             printf 'PORT=%s\n' '${PORT}' >> .env
             printf '%s\n' 'AI_POS_VERSION=0.1.0-preview' >> .env
             printf '%s\n' 'AI_POS_COMMIT=${{ github.sha }}' >> .env
             printf 'AI_POS_BUILD_TIME=%s\n' '${BUILD_TIME}' >> .env
             printf 'DATABASE_URL=%s\n' '${{ secrets.DATABASE_URL }}' >> .env
             printf 'DEEPSEEK_API_KEY=%s\n' '${{ secrets.DEEPSEEK_API_KEY }}' >> .env
             printf 'DEEPSEEK_BASE_URL=%s\n' '${DEEPSEEK_BASE_URL}' >> .env
             printf 'DEEPSEEK_MODEL=%s\n' '${DEEPSEEK_MODEL}' >> .env
             echo 'Remote deployment toolchain:'
             command -v node
             node -v
             if ! command -v pnpm >/dev/null 2>&1; then
               echo 'pnpm is not available on the server.'
               echo 'Initialize the server once as an administrator:'
               echo 'sudo corepack enable'
               echo 'sudo corepack prepare pnpm@9.15.1 --activate'
               echo 'pnpm -v'
               exit 1
             fi
             command -v pnpm
             pnpm -v
             CI=true pnpm install --frozen-lockfile
             pnpm zen:generate:server
             pnpm prisma:push
             pnpm build
             sudo -n cp 'deploy/systemd/ai-pos-server.service' '/etc/systemd/system/${SERVICE_NAME}.service'
             sudo -n systemctl daemon-reload
             sudo -n systemctl enable '${SERVICE_NAME}'
             sudo -n systemctl restart '${SERVICE_NAME}'
             sudo -n systemctl --no-pager --full status '${SERVICE_NAME}'"
